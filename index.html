<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MMS">
  <meta name="theme-color" content="#3b82f6">
  <title>Meter Management System</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    /* ── Critical: disable browser pull-to-refresh in PWA ── */
    html, body {
      overscroll-behavior: none;
      overscroll-behavior-y: none;
      -webkit-overflow-scrolling: touch;
      overflow: hidden;
      width: 100vw; height: 100vh;
      margin: 0; padding: 0;
      touch-action: none;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: #060d1a; }

    /* ── iframe fills everything ───────────────────── */
    #appFrame {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      border: none; display: block;
      z-index: 1;
      touch-action: auto; /* iframe needs its own touch handling */
    }

    /* ── 30px strip — always catches touchstart ─────── */
    #ptrStrip {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 50px;
      z-index: 500;
      background: transparent;
      pointer-events: auto;
      touch-action: pan-down;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Full-screen lock during drag ───────────────── */
    #ptrLock {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 499;
      background: transparent;
      touch-action: none;
      pointer-events: auto;
    }
    #ptrLock.active { display: block; }

    /* ── Pull pill ─────────────────────────────────── */
    #ptrPill {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%) translateY(-110px);
      z-index: 600;
      pointer-events: none;
      background: #0f1e33;
      border: 1px solid #1e3a5f;
      border-top: none;
      border-radius: 0 0 22px 22px;
      padding: 10px 28px 14px;
      display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      min-width: 170px;
      will-change: transform;
    }
    .pill-icon {
      font-size: 20px; line-height: 1;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .pill-icon.spinning {
      display: inline-block;
      animation: spin 0.6s linear infinite;
    }
    .pill-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.67rem; font-weight: 700;
      color: #60a5fa; letter-spacing: 0.05em; white-space: nowrap;
    }
    .pill-track {
      width: 100%; height: 2px;
      background: #1e3a5f; border-radius: 2px;
      overflow: hidden; margin-top: 4px;
    }
    .pill-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 2px; width: 0%;
      transition: width 0.08s linear;
    }

    /* ── Refresh overlay ───────────────────────────── */
    #refreshOverlay {
      display: none; position: fixed; inset: 0;
      background: #060d1a; z-index: 9000;
      flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    #refreshOverlay.on { display: flex; }
    .rspin {
      width: 44px; height: 44px;
      border: 3px solid #1e3a5f;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    .rlabel {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.8rem; font-weight: 600; color: #60a5fa;
    }

    /* ── Loading screen ────────────────────────────── */
    #loadingScreen {
      position: fixed; inset: 0;
      background: #060d1a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loadingScreen.fade-out { opacity: 0; pointer-events: none; }

    .logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(59,130,246,0.4);
      animation: lp 2s ease-in-out infinite;
    }
    @keyframes lp {
      0%,100%{ box-shadow:0 8px 32px rgba(59,130,246,0.4); }
      50%    { box-shadow:0 8px 48px rgba(59,130,246,0.7); }
    }
    h1 {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 1.3rem; font-weight: 800;
      color: #f1f5f9; margin-bottom: 6px;
    }
    .sub {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.7rem; color: #475569;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 32px;
    }
    .progress-wrap {
      width: 200px; height: 3px;
      background: #0a1628; border-radius: 100px;
      overflow: hidden; margin-bottom: 12px;
    }
    .progress-bar {
      height: 100%; border-radius: 100px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      animation: pg 2s ease forwards;
    }
    @keyframes pg {
      0%{width:0%} 50%{width:70%} 80%{width:90%} 100%{width:100%}
    }
    .status-txt {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.72rem; color: #60a5fa;
    }

    /* ── Install / iOS ─────────────────────────────── */
    #installBtn {
      display: none; position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: #0f1e33; border: 1px solid #3b82f6;
      border-radius: 14px; padding: 12px 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.82rem; font-weight: 700; color: #60a5fa;
      cursor: pointer; z-index: 99999;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      align-items: center; gap: 8px; white-space: nowrap;
    }
    #installBtn.visible { display: flex; }

    #iosHint {
      display: none; position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #0f1e33; border-top: 2px solid #3b82f6;
      padding: 16px 20px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 0.76rem; color: #94a3b8; line-height: 1.6;
      z-index: 99999; text-align: center;
    }
    #iosHint.visible { display: block; }
    #iosHintClose {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none;
      color: #475569; font-size: 18px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Redirect handler -->
  <script>
    (function(){
      var p=new URLSearchParams(window.location.search);
      if(p.get('from_update')==='1'){
        var back=localStorage.getItem('mms_redirect_back');
        var sess=localStorage.getItem('mms_redirect_session');
        if(sess&&sess!=='null'&&sess!=='') sessionStorage.setItem('mms_session',sess);
        localStorage.removeItem('mms_redirect_back');
        localStorage.removeItem('mms_redirect_session');
        window.location.replace(back&&back!=='null'?back:
          'https://script.google.com/a/~/macros/s/AKfycbzaYOxfFzLh72UHACcokZB_aBBCPOA-kEebh4Ky8OhVJJ0DgeyhZt9FWnyiU_75NoIecA/exec');
      }
    })();
  </script>

  <!-- Loading screen -->
  <div id="loadingScreen">
    <div class="logo">⚡</div>
    <h1>Meter Management</h1>
    <p class="sub">DVVNL · MDM System · v2.0</p>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
    <p class="status-txt" id="statusText">Connecting to MDM servers...</p>
  </div>

  <!-- App iframe -->
  <iframe id="appFrame"
    src="https://script.google.com/a/~/macros/s/AKfycbzaYOxfFzLh72UHACcokZB_aBBCPOA-kEebh4Ky8OhVJJ0DgeyhZt9FWnyiU_75NoIecA/exec"
    allow="clipboard-read; clipboard-write"
    sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads allow-modals"
  ></iframe>

  <!-- 30px strip always above the iframe -->
  <div id="ptrStrip"></div>

  <!-- Full-screen lock (transparent, active during drag) -->
  <div id="ptrLock"></div>

  <!-- Pull pill -->
  <div id="ptrPill">
    <span class="pill-icon" id="pillIcon">↓</span>
    <span class="pill-text" id="pillText">Pull down to refresh</span>
    <div class="pill-track"><div class="pill-fill" id="pillFill"></div></div>
  </div>

  <!-- Refresh overlay -->
  <div id="refreshOverlay">
    <div class="rspin"></div>
    <div class="rlabel">Refreshing app...</div>
  </div>

  <!-- Install button -->
  <button id="installBtn" onclick="installPWA()">📲 Install MMS App</button>

  <!-- iOS hint -->
  <div id="iosHint">
    <button id="iosHintClose" onclick="closeIOSHint()">×</button>
    📱 <strong style="color:#60a5fa;">Install on iPhone:</strong>
    Tap <strong style="color:#f1f5f9;">Share ⎙</strong> then
    <strong style="color:#f1f5f9;">Add to Home Screen ➕</strong>
  </div>

  <script>
    /* ── refs ─────────────────────────────────────────── */
    var loading        = document.getElementById('loadingScreen');
    var statusText     = document.getElementById('statusText');
    var appFrame       = document.getElementById('appFrame');
    var ptrStrip       = document.getElementById('ptrStrip');
    var ptrLock        = document.getElementById('ptrLock');
    var ptrPill        = document.getElementById('ptrPill');
    var pillIcon       = document.getElementById('pillIcon');
    var pillText       = document.getElementById('pillText');
    var pillFill       = document.getElementById('pillFill');
    var refreshOverlay = document.getElementById('refreshOverlay');
    var installBtn     = document.getElementById('installBtn');
    var iosHint        = document.getElementById('iosHint');

    /* ── Loading screen ───────────────────────────────── */
    var msgs=['Connecting to MDM servers...','Verifying configuration...','Loading dashboard...'];
    var mi=0;
    var mt=setInterval(function(){ statusText.textContent=msgs[++mi%msgs.length]; },900);
    appFrame.addEventListener('load',function(){
      clearInterval(mt); statusText.textContent='Ready!';
      setTimeout(function(){
        loading.classList.add('fade-out');
        setTimeout(function(){ loading.style.display='none'; },400);
      },300);
    });
    setTimeout(function(){
      loading.classList.add('fade-out');
      setTimeout(function(){ loading.style.display='none'; },400);
    },8000);

    /* ── PWA install ──────────────────────────────────── */
    var dp=null;
    window.addEventListener('beforeinstallprompt',function(e){
      e.preventDefault(); dp=e;
      setTimeout(function(){ installBtn.classList.add('visible'); },1);
      setTimeout(function(){ installBtn.classList.remove('visible'); },30000);
    });
    function installPWA(){
      if(!dp) return;
      dp.prompt();
      dp.userChoice.then(function(r){
        if(r.outcome==='accepted') installBtn.classList.remove('visible');
        dp=null;
      });
    }
    window.addEventListener('appinstalled',function(){ installBtn.classList.remove('visible'); });

    /* ── iOS hint ─────────────────────────────────────── */
    var isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
    var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    var isStand  = window.matchMedia('(display-mode: standalone)').matches;
    if(isIOS&&isSafari&&!isStand&&!localStorage.getItem('ios_hint_dismissed'))
      setTimeout(function(){ iosHint.classList.add('visible'); },4000);
    function closeIOSHint(){
      iosHint.classList.remove('visible');
      localStorage.setItem('ios_hint_dismissed','1');
    }

    /* ── Service worker ───────────────────────────────── */
    if('serviceWorker' in navigator)
      navigator.serviceWorker.register('sw.js').catch(function(){});

    /* ═══════════════════════════════════════════════════
       PULL-TO-REFRESH — works in browser AND installed PWA
       ───────────────────────────────────────────────────
       Key fixes for PWA standalone mode:

       1. overscroll-behavior:none on html+body stops Chrome
          Android from intercepting the gesture as its own
          pull-to-refresh before our code sees it.

       2. #ptrStrip is 30px, pointer-events:auto, touch-action:
          pan-down — it always receives touchstart because it
          sits above the iframe in z-index.

       3. On first confirmed downward move we activate #ptrLock
          (full-screen transparent overlay, touch-action:none)
          which takes ownership of the rest of the gesture and
          calls preventDefault() on every touchmove — this
          blocks both the iframe scroll AND Chrome's PTR.

       4. We store the touch identifier from touchstart and
          match it on subsequent events to avoid phantom
          multi-touch issues.
    ═══════════════════════════════════════════════════ */
    (function(){

      var TRIGGER    = 72;   /* px pull needed to trigger */
      var MAX_VISUAL = 105;  /* max pill travel in px     */
      var DAMPEN     = 0.52; /* drag feel resistance      */

      var startY     = 0;
      var startId    = -1;
      var pulling    = false;
      var refreshing = false;
      var triggered  = false;

      /* ── Prevent browser's own PTR on document level ── */
      /* This fires before the iframe intercepts anything  */
      document.addEventListener('touchmove', function(e){
        if(pulling && e.cancelable) e.preventDefault();
      }, { passive: false });

      /* ── touchstart on the 30-px strip ─────────────── */
      ptrStrip.addEventListener('touchstart', function(e){
        if(refreshing) return;
        var t    = e.changedTouches[0];
        startY   = t.clientY;
        startId  = t.identifier;
        pulling  = false;
        triggered = false;
      }, { passive: true });

      /* Also catch touchstart that bleeds onto ptrLock    */
      ptrLock.addEventListener('touchstart', function(e){
        /* Only if we already started on the strip         */
        if(startId === -1) return;
      }, { passive: true });

      /* ── touchmove — non-passive on both elements ───── */
      ptrStrip.addEventListener('touchmove', onMove, { passive: false });
      ptrLock.addEventListener('touchmove',  onMove, { passive: false });

      function onMove(e){
        if(refreshing) return;
        if(startId === -1) return;

        /* Find our touch */
        var t = null;
        for(var i=0;i<e.changedTouches.length;i++){
          if(e.changedTouches[i].identifier===startId){
            t=e.changedTouches[i]; break;
          }
        }
        if(!t) return;

        var dy = t.clientY - startY;
        if(dy <= 1) return;

        /* Confirmed downward move — activate full screen lock */
        if(!pulling){
          pulling = true;
          ptrLock.classList.add('active');
        }

        /* Own this gesture — stop browser PTR + iframe scroll */
        if(e.cancelable) e.preventDefault();

        var pull  = Math.min(dy * DAMPEN, MAX_VISUAL);
        var pct   = Math.min(pull / TRIGGER, 1);
        var pillY = Math.min(pull - 6, MAX_VISUAL - 6);

        /* Animate pill */
        ptrPill.style.transition = 'none';
        ptrPill.style.transform  =
          'translateX(-50%) translateY(' + pillY + 'px)';
        pillFill.style.width = Math.round(pct * 100) + '%';

        if(pull >= TRIGGER){
          pillIcon.textContent     = '↑';
          pillIcon.style.transform = 'none';
          pillText.textContent     = 'Release to refresh';
          triggered = true;
        } else {
          pillIcon.textContent     = '↓';
          pillIcon.style.transform = 'none';
          pillText.textContent     = 'Pull down to refresh';
          triggered = false;
        }
      }

      /* ── touchend / touchcancel ─────────────────────── */
      function onEnd(e){
        if(startId === -1) return;

        /* Check it's our touch */
        var found = false;
        for(var i=0;i<e.changedTouches.length;i++){
          if(e.changedTouches[i].identifier===startId){
            found=true; break;
          }
        }
        /* On touchcancel changedTouches may be empty — treat as ours anyway */
        if(!found && e.type!=='touchcancel' && !pulling){ return; }

        ptrLock.classList.remove('active');
        startId = -1;

        if(!pulling){ return; }
        pulling = false;

        if(triggered){
          doRefresh();
        } else {
          snapBack();
        }
      }

      ptrStrip.addEventListener('touchend',    onEnd, { passive: true });
      ptrStrip.addEventListener('touchcancel', onEnd, { passive: true });
      ptrLock.addEventListener('touchend',     onEnd, { passive: true });
      ptrLock.addEventListener('touchcancel',  onEnd, { passive: true });

      /* ── Snap pill back ─────────────────────────────── */
      function snapBack(){
        ptrPill.style.transition = 'transform 0.3s ease';
        ptrPill.style.transform  = 'translateX(-50%) translateY(-110px)';
        pillFill.style.width = '0%';
        setTimeout(resetPill, 350);
      }

      /* ── Do the refresh ─────────────────────────────── */
      function doRefresh(){
        refreshing = true;

        pillIcon.textContent = '↻';
        pillIcon.className   = 'pill-icon spinning';
        pillText.textContent = 'Refreshing...';
        pillFill.style.width = '100%';

        setTimeout(function(){
          ptrPill.style.transition = 'transform 0.3s ease';
          ptrPill.style.transform  = 'translateX(-50%) translateY(-110px)';

          refreshOverlay.classList.add('on');

          appFrame.src = appFrame.src;

          function onLoad(){
            appFrame.removeEventListener('load', onLoad);
            refreshOverlay.classList.remove('on');
            refreshing = false;
            pillFill.style.width = '0%';
            resetPill();
          }
          appFrame.addEventListener('load', onLoad);

          setTimeout(function(){
            if(!refreshing) return;
            appFrame.removeEventListener('load', onLoad);
            refreshOverlay.classList.remove('on');
            refreshing = false;
            pillFill.style.width = '0%';
            resetPill();
          }, 15000);

        }, 450);
      }

      function resetPill(){
        pillIcon.textContent     = '↓';
        pillIcon.className       = 'pill-icon';
        pillIcon.style.transform = 'none';
        pillText.textContent     = 'Pull down to refresh';
        triggered                = false;
      }

    })();
  </script>
</body>
</html>
